name: "Terraform Review Agent"
description: "Reviews Terraform PRs for security, policy, cost, and AI-approval"
author: "MaripeddiSupraj"

inputs:
  openai_api_key:
    description: "OpenAI API key"
    required: true
  github_token:
    description: "GitHub token"
    required: true
    default: ${{ github.token }}
  terraform_dir:
    description: "Directory with terraform files"
    required: false
    default: ${{ github.workspace }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.0

    - uses: open-policy-agent/setup-opa@v2
      with:
        version: 1.0.0

    - name: Install agent
      shell: bash
      working-directory: ${{ github.action_path }}/..
      run: pip install -r requirements.txt

    - name: Run review
      shell: bash
      working-directory: ${{ github.action_path }}/..
      env:
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
        TERRAFORM_DIR: ${{ inputs.terraform_dir }}
      run: |
        python - <<'PYEOF'
        import asyncio, os, sys
        sys.path.insert(0, os.getcwd())
        from app.models.state import make_initial_state
        from app.workflows.graph import create_review_graph
        async def main():
            initial = make_initial_state()
            initial['pr_number'] = int(os.environ.get('GITHUB_PR_NUMBER') or 0)
            initial['repository'] = os.environ.get('GITHUB_REPOSITORY', '')
            initial['commit_sha'] = os.environ.get('GITHUB_SHA', '')
            initial['terraform_dir'] = os.environ.get('TERRAFORM_DIR', '')
            result = await create_review_graph().ainvoke(dict(initial))
            status = result.get('status', '')
            print('Status:', status)
            if status == 'plan_failed':
                print('Terraform plan failed — skipping review enforcement')
                sys.exit(0)
            ai_review = result.get('ai_review')
            approved = ai_review and ai_review.approved
            sys.exit(0 if approved else 1)
        asyncio.run(main())
        PYEOF
