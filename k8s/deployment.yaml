apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraform-review-agent
  namespace: terraform-review
  labels:
    app: terraform-review-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: terraform-review-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: terraform-review-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      terminationGracePeriodSeconds: 60
      tolerations:
        - key: role
          operator: Equal
          value: api
          effect: NoSchedule
      containers:
        - name: app
          image: us-central1-docker.pkg.dev/project-420cebfc-3df7-4db5-96c/codex-oss-api/terraform-review-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: terraform-review-agent-config
            - secretRef:
                name: terraform-review-agent-secrets
          env:
            - name: REDIS_URL
              value: "redis://redis-service:6379/0"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop:
                - ALL
