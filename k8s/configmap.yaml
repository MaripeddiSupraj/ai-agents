apiVersion: v1
kind: ConfigMap
metadata:
  name: terraform-review-agent-config
  labels:
    app: terraform-review-agent
data:
  APP_NAME: "Terraform Review Agent"
  APP_VERSION: "1.0.0"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  OPENAI_MODEL: "gpt-4o"
  OPENAI_TEMPERATURE: "0.1"
  OPENAI_MAX_TOKENS: "4096"
  REDIS_URL: "redis://redis-service:6379/0"
  REDIS_TTL: "3600"
  TERRAFORM_DIR: "/app/terraform/sample"
  TERRAFORM_BINARY: "terraform"
  OPA_BINARY: "opa"
  OPA_POLICY_DIR: "/app/terraform/sample/policies"
  AWS_REGION: "us-east-1"
