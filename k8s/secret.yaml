apiVersion: v1
kind: Secret
metadata:
  name: terraform-review-agent-secrets
  labels:
    app: terraform-review-agent
type: Opaque
stringData:
  # Replace with actual values. NEVER commit real secrets to git.
  # Use kubectl create secret or a secrets manager (AWS Secrets Manager, Vault, etc.)
  OPENAI_API_KEY: "sk-your-openai-api-key"
  GITHUB_TOKEN: "ghp-your-github-token"
  GITHUB_REPOSITORY: "your-org/your-repo"
  GCP_PROJECT_ID: "your-gcp-project-id"
  GCP_CREDENTIALS_JSON: '{"type": "service_account", "project_id": "your-project"}'
