name: Terraform Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "terraform-review-agent/**/*.tf"
      - "terraform-review-agent/terraform/**/*.tf"
      - "terraform-review-agent/terraform/**/*.rego"

env:
  PYTHON_VERSION: "3.11"

defaults:
  run:
    working-directory: terraform-review-agent

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.0.0

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('terraform-review-agent/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Run Terraform Review
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          REDIS_URL: redis://localhost:6379/0
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: us-central1
        run: |
          python -c "
import asyncio, os, sys
from app.models.state import make_initial_state
from app.workflows.graph import create_review_graph

async def main():
    initial = make_initial_state()
    initial['pr_number'] = int(os.environ.get('GITHUB_PR_NUMBER', '0'))
    initial['repository'] = os.environ.get('GITHUB_REPOSITORY', '')
    initial['commit_sha'] = os.environ.get('GITHUB_SHA', '')
    initial['terraform_dir'] = os.environ.get('TERRAFORM_DIR', '')

    graph = create_review_graph()
    result = await graph.ainvoke(dict(initial))
    status = result.get('status', '')
    print(f'Review complete. Status: {status}')
    ai_review = result.get('ai_review')
    if ai_review:
        print(f'Score: {ai_review.score}/100 — {\"Approved\" if ai_review.approved else \"Changes requested\"}')
    sys.exit(0 if status != 'error' else 1)

asyncio.run(main())
"

      - name: Upload Review Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-report
          path: |
            /tmp/terraform-review-*.json
          retention-days: 7

      - name: Post Review Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('Terraform Review Agent'));

            const summary = '✅ Terraform Review complete. Check the workflow logs for detailed results.';

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: summary,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summary,
              });
            }
